[package]
name = "peakly"
version = "0.1.0"
license = "Apache-2.0"
description = "Peakly: open-source App Store growth insights for Mac"
edition = "2021"

[lib]
name = "peakly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
jsonwebtoken = "9"
tauri-plugin-opener = "2"
